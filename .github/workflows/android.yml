# يبني تطبيق أندرويد (APK للتجربة) ويحطه في Releases باسم android-latest
name: android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "logo.png", ".github/workflows/android.yml"]
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync
      - name: Build APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk masro7-league.apk
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest masro7-league.apk --target "$GITHUB_SHA" \
            --title "تطبيق أندرويد (تجربة)" --notes "نزّل masro7-league.apk وثبّته على الجوال. البناء: ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with: { name: masro7-league-apk, path: app/masro7-league.apk }
