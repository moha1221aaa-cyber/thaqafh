# يبني نسخة قوقل بلاي (AAB موقّع بمفتاح الرفع) ويحطها في Releases باسم play-latest
# أول تشغيل: يسوي مفتاح الرفع app/android/app/upload.p12 (محمي بكلمة السر ANDROID_KEY_PASS) ويحفظه في المستودع.
# المفتاح ما ينسوى مرة ثانية أبد لو موجود (قوقل بلاي يرفض أي تحديث بمفتاح ثاني).
name: play
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: play, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        run: |
          if [ ${#ANDROID_KEY_PASS} -lt 12 ]; then
            echo "::error::حط سر ANDROID_KEY_PASS في Settings > Secrets and variables > Actions (12 حرف أو أكثر)"; exit 1; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Create upload key (first time only)
        run: |
          K=android/app/upload.p12
          if [ -f "$K" ]; then echo "المفتاح موجود"; exit 0; fi
          keytool -genkeypair -keystore "$K" -storetype pkcs12 -alias upload -keyalg RSA -keysize 4096 \
            -validity 10000 -storepass "$ANDROID_KEY_PASS" -dname "CN=MASRO7 LEAGUE, C=SA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$K" && git commit -m "مفتاح الرفع لقوقل بلاي (محمي بكلمة سر في GitHub Secrets)" && git push
      - name: Check key password
        run: keytool -list -keystore android/app/upload.p12 -storetype pkcs12 -storepass "$ANDROID_KEY_PASS" >/dev/null || { echo "::error::كلمة السر ANDROID_KEY_PASS ما تفتح المفتاح الموجود"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run sync
      - name: Build AAB
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab masro7-league-$VERSION_NAME.aab
          gh release delete play-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create play-latest masro7-league-$VERSION_NAME.aab --target "$(git rev-parse HEAD)" \
            --title "نسخة قوقل بلاي $VERSION_NAME" --notes "ارفع ملف .aab في Play Console. versionCode $VERSION_CODE"
